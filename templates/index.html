<html lang="zh-CN">

<meta charset="UTF-8">

<title>小红书图文生成器 - AGI188</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--text:#f5f5f7;--sub:#86868b;--dim:#48484a;--blue:#2997ff;--purple:#bf5af2;--border:#333;--success:#30d158;--gold:#ffd700}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.nav{position:fixed;top:0;left:0;right:0;z-index:99;background:rgba(0,0,0,0.72);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,0.04)}
.nav-in{max-width:960px;margin:0 auto;padding:0 24px;height:48px;display:flex;justify-content:space-between;align-items:center}
.nav-brand{font-size:16px;font-weight:700;letter-spacing:0.02em;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.main{max-width:800px;margin:0 auto;padding:100px 24px 80px}
.hero{text-align:center;margin-bottom:40px}
.hero-icon{font-size:54px;margin-bottom:12px}
.hero h1{font-size:36px;font-weight:700;letter-spacing:-0.03em;margin-bottom:6px;background:linear-gradient(180deg,#f5f5f7,#a1a1a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:6px;margin-bottom:28px;background:rgba(255,255,255,0.04);padding:5px;border-radius:12px}
.tab{flex:1;padding:11px 14px;border-radius:8px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;border:none;background:transparent;color:var(--sub)}
.tab.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.tab:hover:not(.active){background:rgba(255,255,255,0.08);color:var(--text)}
.form-group{margin-bottom:22px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em}
.form-input,textarea{width:100%;padding:15px 18px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:15px;font-family:inherit;transition:all 0.2s;outline:none}
textarea{resize:vertical;min-height:160px;line-height:1.6}
.form-input:focus,textarea:focus{border-color:var(--purple);background:rgba(255,255,255,0.06)}
::placeholder{color:var(--dim)}
.btn{width:100%;padding:16px 24px;background:linear-gradient(135deg,var(--blue),var(--purple));border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(75,118,252,0.25)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-sm{width:auto;padding:10px 18px;font-size:13px;display:inline-flex}
.btn-sm2{padding:8px 14px;font-size:12px;background:rgba(255,255,255,0.08);border:1px solid var(--border);color:var(--text)}
.result-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:14px}
.result-card h3{font-size:17px;margin-bottom:14px;color:var(--success)}
.result-text{white-space:pre-wrap;line-height:1.7;font-size:14px;color:var(--text);margin-bottom:14px}
.copy-btn{padding:9px 18px;background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
.copy-btn:hover{background:rgba(255,255,255,0.12)}
.hidden{display:none!important}
.loading{text-align:center;padding:40px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--success);color:#fff;border-radius:12px;font-size:14px;font-weight:600;z-index:1000;animation:fadeInUp 0.3s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Article list styles */
.article-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.article-filter select,.article-filter input{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font-size:12px;outline:none;font-family:inherit}
.article-filter input{flex:1;min-width:120px}
.article-filter select:focus,.article-filter input:focus{border-color:var(--purple)}
.article-list{max-height:420px;overflow-y:auto}
.article-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;transition:all 0.15s;border:1px solid transparent;margin-bottom:4px}
.article-item:hover{background:rgba(255,255,255,0.04);border-color:var(--border)}
.article-item.selected{background:rgba(191,90,242,0.1);border-color:var(--purple)}
.article-item .cat-badge{font-size:10px;padding:2px 8px;border-radius:8px;white-space:nowrap;flex-shrink:0;font-weight:600}
.cat-recruit{background:rgba(48,209,88,0.15);color:var(--success)}
.cat-exam{background:rgba(255,159,10,0.15);color:#ff9f0a}
.cat-police{background:rgba(41,151,255,0.15);color:var(--blue)}
.cat-notice{background:rgba(191,90,242,0.15);color:var(--purple)}
.cat-sanzhi{background:rgba(255,55,95,0.15);color:#ff375f}
.article-item .art-info{flex:1;min-width:0}
.article-item .art-title{font-size:13px;line-height:1.4;color:var(--text)}
.article-item .art-meta{font-size:10px;color:var(--dim);margin-top:3px}
.article-item .art-link{flex-shrink:0;padding:4px 8px;border-radius:8px;color:var(--blue);font-size:14px;text-decoration:none;opacity:0.6;transition:all 0.15s}
.article-item .art-link:hover{opacity:1;background:rgba(41,151,255,0.12)}
.article-hint{text-align:center;padding:30px 20px;color:var(--dim)}
.article-hint .icon{font-size:36px;margin-bottom:8px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tag-item{padding:3px 10px;border-radius:10px;font-size:11px;background:rgba(255,255,255,0.06);color:var(--sub);cursor:pointer;border:1px solid transparent}
.tag-item.selected{background:rgba(191,90,242,0.15);color:var(--purple);border-color:var(--purple)}
.flex-row{display:flex;gap:8px}
.flex-row .btn{flex:1}
.badge-new{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;background:var(--purple);color:#fff;margin-left:4px}
.copy-success{animation:fadeInUp 0.3s ease}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-in">
    <div class="nav-brand">🎨 小红书图文生成器</div>
  </div>
</nav>

<main class="main">
  <div class="hero">
    <div class="hero-icon">🚀</div>
    <h1>10秒出爆款</h1>
    <p style="color:var(--sub);font-size:16px">公告抓取 → AI写文案 → 生成封面，一站式搞定</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab0-btn">📋 公告列表<span class="badge-new">NEW</span></button>
    <button class="tab" id="tab1-btn">🎨 封面生成</button>
    <button class="tab" id="tab2-btn">📝 爆款文案</button>
  </div>

  <!-- Tab 0: 公告列表 -->
  <div id="tab0">
    <div class="article-filter">
      <select id="siteFilter" onchange="filterArticles()"><option value="all">全部站点</option><option value="hrss_rsksw">天津人事考试网</option><option value="hrss_sydw">人社局·事业单位招聘</option><option value="hrss_gggs">人社局·公告公示</option><option value="huijun">天津荟骏</option></select>
      <select id="catFilter" onchange="filterArticles()"><option value="all">全部类型</option><option value="招聘">招聘</option><option value="考试">考试</option><option value="辅警/消防">辅警/消防</option><option value="三支一扶">三支一扶</option><option value="公示">公示</option></select>
      <input type="text" id="searchInput" placeholder="搜索公告..." oninput="filterArticles()">
    </div>
    <div class="article-list" id="articleList"></div>
    <div id="articleHint" class="article-hint"><div class="icon">👆</div><div>请选择公告，自动填入文案生成器</div></div>
  </div>

  <!-- Tab 1: 封面生成 -->
  <div id="tab1" class="hidden">
    <div class="form-group">
      <label class="form-label">主标题</label>
      <input class="form-input" id="title" placeholder="例如：天津落户最新政策2026">
    </div>
    <div class="form-group">
      <label class="form-label">副标题</label>
      <input class="form-input" id="subtitle" placeholder="例如：这5类人直接落户，别再跑冤枉路了">
    </div>
    <div class="form-group">
      <label class="form-label">地标建筑</label>
      <input class="form-input" id="landmark" placeholder="例如：天津之眼 / 不填就不用地标">
    </div>
    <div class="flex-row">
      <button class="btn btn-sm2" onclick="fillFromArticle()" style="flex:1">📋 从公告填充标题</button>
      <button class="btn" id="btn-cover" style="flex:2">🚀 生成封面</button>
    </div>
    <div id="cover-result" class="hidden" style="margin-top:28px;text-align:center"></div>
  </div>

  <!-- Tab 2: 爆款文案 -->
  <div id="tab2" class="hidden">
    <div class="form-group">
      <label class="form-label">文章链接 或 直接粘贴内容 <span style="color:var(--dim);font-weight:400">（从公告列表选择自动填入链接）</span></label>
      <textarea id="article-content" placeholder="两种方式：&#10;1）从公告列表选择 → 自动填入链接&#10;2）直接粘贴文章正文内容"></textarea>
    </div>
    <button class="btn" id="btn-copy">🚀 一键生成爆款文案</button>
    <div id="copy-loading" class="hidden loading">
      <div class="spinner"></div>
      <p style="color:var(--sub)">AI 正在分析内容，生成3版文案...</p>
    </div>
    <div id="copy-result" class="hidden" style="margin-top:28px"></div>
  </div>
</main>

const copyCache = [];
const catClassMap = {"招聘":"cat-recruit","考试":"cat-exam","辅警/消防":"cat-police","公示":"cat-notice","三支一扶":"cat-sanzhi"};
let selectedArticle = null;

function filterArticles() {
  const site = document.getElementById("siteFilter").value;
  const cat = document.getElementById("catFilter").value;
  const q = document.getElementById("searchInput").value.toLowerCase();
  let arts = ARTICLES;
  if (site !== "all") arts = arts.filter(a => a.siteId === site);
  if (cat !== "all") arts = arts.filter(a => a.category === cat);
  if (q) arts = arts.filter(a => a.title.toLowerCase().includes(q) || a.site.toLowerCase().includes(q));
  
  // 从标题中提取发布日期 (格式: YYYY-MM-DD)，按日期降序排列
  const dateReg = /(\d{4}-\d{2}-\d{2})/;
  arts = arts.slice().sort((a, b) => {
    const ma = (a.title || "").match(dateReg);
    const mb = (b.title || "").match(dateReg);
    const da = ma ? ma[1] : "0000-00-00";
    const db = mb ? mb[1] : "0000-00-00";
    return db.localeCompare(da);
  });
  
  const list = document.getElementById("articleList");
  list.innerHTML = arts.map((a,i) => {
    const sel = selectedArticle && selectedArticle.link === a.link ? " selected" : "";
    const m = (a.title || "").match(dateReg);
    const dateStr = m ? m[1] : "";
    const titleClean = m ? a.title.replace(dateReg, "").replace(/\s+$/, "") : a.title;
    return `<div class="article-item${sel}" onclick="pickArticle(${ARTICLES.indexOf(a)})">
      <span class="cat-badge ${catClassMap[a.category]||'cat-recruit'}">${a.category}</span>
      <div class="art-info"><div class="art-title">${titleClean}</div><div class="art-meta">${a.site}${dateStr ? ' · <span style="color:var(--blue)">'+dateStr+'</span>' : ''}</div></div>
      <a class="art-link" href="${a.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="打开原文">↗</a>
    </div>`;
  }).join("");
}

function pickArticle(idx) {
  selectedArticle = ARTICLES[idx];
  // Auto-fill into tab2 textarea
  document.getElementById("article-content").value = selectedArticle.link;
  document.getElementById("articleHint").style.display = "none";
  showToast("✅ 已填入链接，切换到「爆款文案」生成吧！");
  // Also pre-fill cover title
  document.getElementById("title").value = selectedArticle.title.replace(/\s+/g," ").substring(0,15);
  filterArticles();
}

function fillFromArticle() {
  if (!selectedArticle) { showToast("请先从公告列表选择一条公告"); return; }
  document.getElementById("title").value = selectedArticle.title.replace(/\s+/g," ").substring(0,15);
  showToast("已填充封面标题");
}

// Tab switching
function switchTab(n) {
  ["tab0","tab1","tab2"].forEach((id,i) => {
    document.getElementById(id).classList.toggle("hidden", i !== n);
    document.getElementById("tab"+i+"-btn").classList.toggle("active", i === n);
  });
}
document.getElementById("tab0-btn").onclick = () => switchTab(0);
document.getElementById("tab1-btn").onclick = () => switchTab(1);
document.getElementById("tab2-btn").onclick = () => switchTab(2);

// Cover generation
document.getElementById("btn-cover").onclick = async function() {
  const title = document.getElementById("title").value.trim();
  const subtitle = document.getElementById("subtitle").value.trim();
  const landmark = document.getElementById("landmark").value.trim() || "现代城市建筑";
  if (!title) { showToast("请输入主标题"); return; }
  const btn = this;
  btn.disabled = true; btn.textContent = "生成中...";
  try {
    const res = await fetch("/generate-cover", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({title, subtitle, landmark})
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById("cover-result").innerHTML =
        `<img src="${data.url}" style="max-width:100%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
        <div style="margin-top:14px">
          <a href="${data.url}" download="xiaohongshu-cover.png" style="display:inline-block;padding:11px 22px;background:var(--success);color:#fff;border-radius:12px;text-decoration:none;font-weight:600">📥 下载封面</a>
        </div>`;
      document.getElementById("cover-result").classList.remove("hidden");
      showToast("封面生成成功！");
    } else { showToast("生成失败: " + data.error); }
  } catch(e) { showToast("出错了: " + e.message); }
  btn.disabled = false; btn.textContent = "🚀 生成封面";
};

// Copy generation
document.getElementById("btn-copy").onclick = async function() {
  let content = document.getElementById("article-content").value.trim();
  if (!content) { showToast("请粘贴文章链接或选择公告"); return; }
  const btn = this;
  btn.disabled = true;
  document.getElementById("copy-loading").classList.remove("hidden");
  document.getElementById("copy-result").classList.add("hidden");
  try {
    if (content.startsWith("http://") || content.startsWith("https://")) {
      showToast("正在抓取文章内容...");
      const fetchRes = await fetch("/fetch-content", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:content})});
      const fetchData = await fetchRes.json();
      if (fetchData.error) throw new Error(fetchData.error);
      content = fetchData.content;
      showToast("抓取成功！正在生成文案...");
    }
    const res = await fetch("/generate-copy", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content})});
    const data = await res.json();
    if (data.error) { showToast("生成失败: "+data.error); return; }
    let html = "";
    const versions = [
      {key:"version1",name:"🔥 版本1：爆款标题党"},
      {key:"version2",name:"📚 版本2：干货详细版"},
      {key:"version3",name:"💖 版本3：情感共鸣版"}
    ];
    for (let i=0;i<versions.length;i++) {
      const v = versions[i];
      if (data[v.key]) {
        const fullText = data[v.key].title + "\n\n" + data[v.key].content + "\n\n" + data[v.key].tags.map(t=>"#"+t).join(" ");
        copyCache[i] = fullText;
        html += `<div class="result-card"><h3>${v.name}</h3><div class="result-text">${escapeHtml(fullText)}</div><button class="copy-btn" onclick="doCopy(${i})">📋 复制文案</button></div>`;
      }
    }
    document.getElementById("copy-result").innerHTML = html;
    document.getElementById("copy-result").classList.remove("hidden");
    showToast("文案生成成功！");
  } catch(e) { showToast("出错了: "+e.message); }
  btn.disabled = false;
  document.getElementById("copy-loading").classList.add("hidden");
};

function doCopy(idx) {
  navigator.clipboard.writeText(copyCache[idx]).then(() => showToast("已复制到剪贴板！"));
}

function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function escapeHtml(text) {
  const d = document.createElement("div");
  d.textContent = text; return d.innerHTML;
}

// Init
filterArticles();
</script>
